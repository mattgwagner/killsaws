name: Deploy

# Push to main: sim tests, build, and (once the CLOUDFLARE_API_TOKEN repo
# secret exists) deploy the Worker to https://killsaws.redleg.dev.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BUILD: ${{ github.sha }}
      - name: Deploy
        if: ${{ env.CF_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
